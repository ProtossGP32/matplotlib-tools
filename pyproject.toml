[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matplotlib_tools"
version = "0.1.0"
description = "Tools for generating styled static and animated plots with Matplotlib."
authors = [
    { name="Marc Palacín Marfil", email="marc.palacin.marfil@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text="MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "matplotlib>=3.7.2",
    "pandas>=2.1.1",
    "cycler>=0.11.0",
    "pillow>=10.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]
